<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="generator" content="Kaléido (Lexis+)">
<title>{{titre}}</title>
<link rel="stylesheet" href="lecteur.css">
</head>

      <button class="icone" id="b-favori" title="Ajouter aux favoris">☆</button>
      <button class="icone" id="b-theme" title="Thème clair / sombre">◐</button>
    </div>
  </header>
  <nav id="nav" class="nav" aria-label="Navigation hiérarchique"></nav>
  <main id="contenu" class="contenu" tabindex="-1"></main>
  <aside id="toc" class="toc" aria-label="Sommaire"></aside>
</div>
<div id="voile" class="voile" hidden></div>
<button id="b-annoter" class="annoter" hidden>✎ Annoter</button>
<script src="contenu.js"></script>
<script src="lecteur.js"></script>

</html>
